<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="description" content="Новини - Techno Tavern Пловдив" />

    <title>Новини - Techno Tavern Пловдив</title>

    <link rel="icon" href="/assets/logo.svg" />

    <!-- Preload critical above-the-fold image -->
    <link rel="preload" href="/assets/logo.svg" as="image" type="image/svg+xml" />

    <!-- Preconnect to external domains for faster resource loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical resources -->
    <link rel="preload" href="/news/data/top-news.json" as="fetch" crossorigin />
    <link rel="preload" href="/news/data/news.json" as="fetch" crossorigin />

    <!-- Critical CSS inline or load asynchronously -->
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/news/news.css" />

    <!-- Load Google Fonts asynchronously to prevent render blocking -->
    <link rel="preload"
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet" />
    </noscript>
</head>

<body>
    <main class="layout">
        <div class="mainHeader">
            <img src="/assets/logo.svg" class="logo" alt="logo" fetchpriority="high" />
            <h1>Techno Tavern</h1>
            <span>Социално пространство в Пловдив</span>
        </div>

        <nav class="tabs">
            <a href="/" class="tab"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
                </svg></a>
            <a href="/news/" class="tab active"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path
                        d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM6 10h12v2H6zm0 4h8v2H6z" />
                </svg></a>
            <a href="/stocks/" class="tab"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path
                        d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z" />
                </svg></a>
        </nav>

        <div class="content">
            <!-- Daily Top News Summary -->
            <section id="daily-summary" class="summary-card" style="display: none;">
                <div class="summary-header">
                    <div class="summary-title-row">
                        <div class="summary-badge">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
                                <path d="M13 10V3L4 14h7v7l9-11h-7z" />
                            </svg>
                            <span>Дневен обзор</span>
                        </div>
                        <span id="summary-updated" class="summary-updated"></span>
                    </div>
                    <p id="summary-overview" class="summary-overview"></p>
                </div>

                <div class="summary-divider"></div>

                <div id="summary-stories" class="summary-stories"></div>
            </section>

            <!-- Feed Section Header -->
            <div class="feed-header">
                <h2>Всички новини</h2>
                <span class="feed-subtitle">Последни 24 часа</span>
            </div>

            <!-- news feed -->
            <div id="news-feed">
                <div class="feed-loading">Зареждане на новини...</div>
            </div>
            <!-- /news feed -->
        </div>

        <footer class="site-footer">
            <span>Архив</span>
            <a href="/politics/" class="footer-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path
                        d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.87-3.13-7-7-7zm2 15H10v-1h4v1zm0-2H10v-1h4v1zm-1.5-3.59V14h-1v-2.59L9.67 9.59l.71-.71L12 10.5l1.62-1.62.71.71-1.83 1.82z" />
                </svg>Политика</a>
        </footer>

        <script>
            const CATEGORY_CLASSES = {
                "Политика": "cat-politika",
                "Икономика": "cat-ikonomika",
                "Общество": "cat-obshtestvo",
                "Свят": "cat-sviat",
                "Технологии": "cat-tehnologii",
                "Култура": "cat-kultura",
                "Спорт": "cat-sport",
                "Здравеопазване": "cat-zdraveopazvane",
                "Екология": "cat-ekologia",
                "Други": "cat-drugi"
            };

            const SOURCE_COLORS = {
                "OffNews": "#E91E63",
                "Dnevnik": "#2196F3",
                "Свободна точка": "#FF9800",
                "Mediapool": "#00BCD4",
                "Capital": "#4CAF50",
                "Actualno": "#9C27B0",
                "Hacker News": "#FF6600",
                "FrogNews": "#795548",
                "DW": "#0080FF"
            };

            async function loadTopNewsSummary() {
                const summaryContainer = document.getElementById("daily-summary");
                const overviewElem = document.getElementById("summary-overview");
                const updatedElem = document.getElementById("summary-updated");
                const storiesContainer = document.getElementById("summary-stories");

                try {
                    const cacheBuster = Math.floor(Date.now() / (10 * 60 * 1000));
                    const response = await fetch(`/news/data/top-news.json?v=${cacheBuster}`);
                    if (!response.ok) return;

                    const data = await response.json();
                    if (!data || !data.stories || data.stories.length === 0) return;

                    overviewElem.textContent = data.overview || "";

                    if (data.updatedAt) {
                        const date = new Date(data.updatedAt);
                        const timeStr = date.toLocaleTimeString("bg-BG", { hour: '2-digit', minute: '2-digit' });
                        const dateStr = date.toLocaleDateString("bg-BG", { day: 'numeric', month: 'short' });
                        updatedElem.textContent = `${dateStr}, ${timeStr}`;
                    }

                    storiesContainer.innerHTML = "";
                    data.stories.forEach((story) => {
                        const storyCard = document.createElement("div");
                        storyCard.className = "summary-story-item";

                        const catClass = CATEGORY_CLASSES[story.category] || "cat-drugi";
                        const categoryBadge = `<span class="category-badge ${catClass}">${story.category || "Общи"}</span>`;

                        const sourcesHtml = Array.isArray(story.sources) && story.sources.length > 0
                            ? `<div class="story-sources">
                                <span class="story-sources-label">Източници:</span>
                                ${story.sources.map(src => {
                                    const color = SOURCE_COLORS[src] || "#555";
                                    return `<span class="story-source-pill" style="background-color: ${color}">${src}</span>`;
                                }).join("")}
                               </div>`
                            : "";

                        storyCard.innerHTML = `
                            <div class="summary-story-header">
                                ${categoryBadge}
                            </div>
                            <div class="story-headline">${story.headline}</div>
                            <p class="story-summary">${story.summary}</p>
                            ${sourcesHtml}
                        `;
                        storiesContainer.appendChild(storyCard);
                    });

                    summaryContainer.style.display = "block";
                } catch (err) {
                    console.warn("Top news summary not loaded:", err);
                }
            }

            async function loadNewsFeed() {
                const feedContainer = document.getElementById("news-feed");

                try {
                    const cacheBuster = Math.floor(Date.now() / (10 * 60 * 1000));
                    const response = await fetch(`/news/data/news.json?v=${cacheBuster}`);
                    const data = await response.json();
                    feedContainer.innerHTML = "";

                    data.items.forEach((item) => {
                        const newsElement = document.createElement("a");
                        newsElement.className = "news-item";
                        newsElement.href = item.link;
                        newsElement.target = "_blank";
                        newsElement.rel = "noopener noreferrer";

                        // Calculate time difference
                        const now = new Date();
                        const pubDate = new Date(item?.pubDate);
                        const diffMs = now - pubDate;
                        const diffMins = Math.floor(diffMs / (1000 * 60));
                        const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
                        const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

                        let formattedDate;
                        switch (true) {
                            case diffHours < 1:
                                formattedDate = `преди ${diffMins} минути`;
                                break;
                            case diffHours < 24:
                                formattedDate = `преди ${diffHours} часа`;
                                break;
                            default:
                                formattedDate = `преди ${diffDays} дни`;
                        }

                        // Build the news item with optional thumbnail and source badge
                        const thumbnailHtml = item.thumbnail?.link ? `<img src="${item.thumbnail.link}" alt="${item.title}" class="news-thumbnail" referrerpolicy="no-referrer" />` : '';
                        const sourceBadgeHtml = item.source?.name ? `<span class="source-badge" style="background-color: ${item.source.color}">${item.source.name}</span>` : '';
                        const dateHtml = `<span class="news-date">${sourceBadgeHtml}${formattedDate}</span>`;
                        newsElement.innerHTML = `
                        <div class="news-content">
                            <span class="news-link">${item.title}</span>
                            ${dateHtml}
                        </div>
                        ${thumbnailHtml}
                    `;

                        feedContainer.appendChild(newsElement);
                    });
                } catch (error) {
                    console.error("Error loading news:", error);
                    feedContainer.innerHTML =
                        '<div class="feed-error">Неуспешно зареждане на новините. Моля, опитайте по-късно.</div>';
                }
            }

            // Load top news summary and news feed when page is ready
            document.addEventListener("DOMContentLoaded", () => {
                loadTopNewsSummary();
                loadNewsFeed();
            });
        </script>
</body>

</html>
