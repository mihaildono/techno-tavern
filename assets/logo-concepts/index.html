<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logo concepts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;600;700&display=swap">
<style>body{margin:0;padding:32px 16px;background:#1C120D;color:#F4EADB;font-family:"Sofia Sans",sans-serif}main{max-width:1120px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:28px}
figure{margin:0}.big{background:#2A1C15;border-radius:12px;padding:20px;display:grid;place-items:center}.big img{width:140px;height:140px}
figcaption{margin-top:10px;font-size:15px}.sm{float:right;display:inline-flex;gap:8px;align-items:center}p{color:#B5A08A;margin:6px 0;line-height:1.4}code{font-size:12px;color:#8A7563}</style></head>
<body><main><figure><div class="big"><img src="01-robot-stein.svg" alt=""></div><figcaption><b>Робот-халба</b> <span class="sm"><img src="01-robot-stein.svg" width="32" height="32" alt=""><img src="01-robot-stein.svg" width="16" height="16" alt=""></span><p>The 2025 mascot, reduced: the robot and the beer become one object.</p><code>01-robot-stein.svg</code></figcaption></figure><figure><div class="big"><img src="02-roman-theatre.svg" alt=""></div><figcaption><b>Античен театър</b> <span class="sm"><img src="02-roman-theatre.svg" width="32" height="32" alt=""><img src="02-roman-theatre.svg" width="16" height="16" alt=""></span><p>Plovdiv's Roman theatre seen from above; its tiers double as broadcast waves.</p><code>02-roman-theatre.svg</code></figcaption></figure><figure><div class="big"><img src="03-seven-hills.svg" alt=""></div><figcaption><b>Седемте тепета</b> <span class="sm"><img src="03-seven-hills.svg" width="32" height="32" alt=""><img src="03-seven-hills.svg" width="16" height="16" alt=""></span><p>Plovdiv's seven hills with a transmitter: local roots, national news.</p><code>03-seven-hills.svg</code></figcaption></figure><figure><div class="big"><img src="04-tt-taps.svg" alt=""></div><figcaption><b>ТТ кранове</b> <span class="sm"><img src="04-tt-taps.svg" width="32" height="32" alt=""><img src="04-tt-taps.svg" width="16" height="16" alt=""></span><p>Two Т's (same in Latin and Cyrillic) drawn as beer taps on a bar rail.</p><code>04-tt-taps.svg</code></figcaption></figure><figure><div class="big"><img src="05-foam-rss.svg" alt=""></div><figcaption><b>Пинта с фийд</b> <span class="sm"><img src="05-foam-rss.svg" width="32" height="32" alt=""><img src="05-foam-rss.svg" width="16" height="16" alt=""></span><p>A pint with the RSS symbol inside: the tavern now pours news.</p><code>05-foam-rss.svg</code></figcaption></figure><figure><div class="big"><img src="06-tavern-sign.svg" alt=""></div><figcaption><b>Табела</b> <span class="sm"><img src="06-tavern-sign.svg" width="32" height="32" alt=""><img src="06-tavern-sign.svg" width="16" height="16" alt=""></span><p>A hanging tavern sign with the robot face; reads as a place, not a product.</p><code>06-tavern-sign.svg</code></figcaption></figure><figure><div class="big"><img src="07-pixel-bot.svg" alt=""></div><figcaption><b>Пиксел бот</b> <span class="sm"><img src="07-pixel-bot.svg" width="32" height="32" alt=""><img src="07-pixel-bot.svg" width="16" height="16" alt=""></span><p>8-bit robot head; survives at 16px better than anything else here.</p><code>07-pixel-bot.svg</code></figcaption></figure><figure><div class="big"><img src="08-talking-pint.svg" alt=""></div><figcaption><b>Говореща халба</b> <span class="sm"><img src="08-talking-pint.svg" width="32" height="32" alt=""><img src="08-talking-pint.svg" width="16" height="16" alt=""></span><p>A speech bubble topped with foam: the social space that started it.</p><code>08-talking-pint.svg</code></figcaption></figure><figure><div class="big"><img src="09-raspberry-bot.svg" alt=""></div><figcaption><b>Малина-бот</b> <span class="sm"><img src="09-raspberry-bot.svg" width="32" height="32" alt=""><img src="09-raspberry-bot.svg" width="16" height="16" alt=""></span><p>A raspberry with an antenna: the Raspberry Pi and Hermes agent that run the site.</p><code>09-raspberry-bot.svg</code></figcaption></figure><figure><div class="big"><img src="10-coaster-clock.svg" alt=""></div><figcaption><b>Подложка-часовник</b> <span class="sm"><img src="10-coaster-clock.svg" width="32" height="32" alt=""><img src="10-coaster-clock.svg" width="16" height="16" alt=""></span><p>A beer mat as a 24h dial: 8 ticks for the 3-hour fetch, the hand on 18:30 for the digest.</p><code>10-coaster-clock.svg</code></figcaption></figure></main></body></html>
