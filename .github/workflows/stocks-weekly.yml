name: Stocks — Weekly Deep Scan

on:
  schedule:
    # Every Sunday at 20:00 UTC (full fundamental rescan)
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv pip install -r requirements.txt --system

      - name: Run weekly scan
        run: |
          python stocks/undervalued_stocks.py \
            --output stocks/data/weekly.json \
            --run-type weekly

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stocks/data/weekly.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: weekly stock scan $(date -u +%Y-%m-%d) [skip ci]"
          git push
