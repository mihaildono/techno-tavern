name: Stocks — Daily Price Scan

on:
  schedule:
    # Weekdays at 21:00 UTC (after US market close at ~20:00 UTC / 4PM ET)
    - cron: "0 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          uv venv .venv --clear
          uv pip install -r requirements.txt
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Run daily price scan
        run: |
          python stocks/undervalued_stocks.py \
            --quick \
            --output stocks/data/daily.json \
            --run-type daily

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stocks/data/daily.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: daily stock scan $(date -u +%Y-%m-%d) [skip ci]"
          git push
