<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="description" content="Социално пространство в Пловдив" />

    <title>Techno Tavern Пловдив</title>

    <link rel="icon" href="./assets/logo.svg">

    <!-- Preload critical above-the-fold image -->
    <link rel="preload" href="./assets/logo.svg" as="image" type="image/svg+xml" />

    <!-- Preconnect to external domains for faster resource loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://masto.bg">

    <!-- Critical CSS inline or load asynchronously -->
    <link rel="stylesheet" href="./style.css" />

    <!-- Load Google Fonts asynchronously to prevent render blocking -->
    <link rel="preload"
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet" />
    </noscript>
</head>

<body>
    <main class="layout">
        <div class="mainHeader">
            <img src="./assets/logo.svg" class="logo" alt="logo" fetchpriority="high" />
            <h1>Techno Tavern</h1>
            <span>Социално пространство в Пловдив</span>
        </div>

        <nav class="tabs">
            <a href="/" class="tab active"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
                </svg></a>
            <a href="/news/" class="tab"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path
                        d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM6 10h12v2H6zm0 4h8v2H6z" />
                </svg></a>
            <a href="/stocks/" class="tab"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path
                        d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z" />
                </svg></a>
        </nav>

        <div class="content">
            <!-- mastodon timeline -->
            <div id="mastodon-feed">
                <div class="feed-loading">Зареждане на публикации...</div>
            </div>
            <!-- /mastodon timeline -->
        </div>

        <footer class="site-footer">
            <a href="/about/" class="footer-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path
                        d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z" />
                </svg>Как работи?</a>
            <span>Архив</span>
            <a href="/politics/" class="footer-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path
                        d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.87-3.13-7-7-7zm2 15H10v-1h4v1zm0-2H10v-1h4v1zm-1.5-3.59V14h-1v-2.59L9.67 9.59l.71-.71L12 10.5l1.62-1.62.71.71-1.83 1.82z" />
                </svg>Политика</a>
        </footer>
    </main>

    <a href="https://revolut.me/mihailyhx" target="_blank" rel="noopener noreferrer" class="floating-donate-btn" title="Подкрепи проекта в Revolut" aria-label="Подкрепи проекта в Revolut">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <span>Подкрепи</span>
    </a>

    <script>
        async function loadMastodonPosts() {
            const feedContainer = document.getElementById('mastodon-feed');

            try {
                const response = await fetch('https://masto.bg/api/v1/accounts/115955044932859142/statuses?limit=5');
                const posts = await response.json();

                feedContainer.innerHTML = '';

                posts.forEach(post => {
                    const postElement = document.createElement('div');
                    postElement.className = 'mastodon-post';

                    // Remove hyperlinks from hashtags but keep them styled
                    let content = post.content;
                    content = content.replace(/<a[^>]*class="[^"]*mention hashtag[^"]*"[^>]*>(.*?)<\/a>/g, '<span class="hashtag">$1</span>');

                    postElement.innerHTML = `
                        <div class="post-content">${content}</div>
                    `;

                    feedContainer.appendChild(postElement);
                });
            } catch (error) {
                feedContainer.innerHTML = '<div class="feed-error">Failed to load posts. Please try again later.</div>';
            }
        }

        // Load posts when page is ready
        document.addEventListener('DOMContentLoaded', loadMastodonPosts);
    </script>
</body>

</html>
